<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LLM Production Monitor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0b0e14; --card: #131722; --border: #232838; --text: #e6e9ef;
    --muted: #8b93a7; --accent: #5b8cff; --danger: #ff5b6a; --ok: #3ecf8e;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         background: var(--bg); color: var(--text); }
  header { padding: 20px 28px; border-bottom: 1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
  header h1 { font-size: 18px; margin:0; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .refresh-badge { font-size: 12px; color: var(--muted); }
  main { padding: 24px 28px; max-width: 1200px; margin: 0 auto; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .stat-card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
  .stat-card .value { font-size: 26px; font-weight: 700; margin-top: 6px; }
  .stat-card .value.danger { color: var(--danger); }
  .stat-card .value.ok { color: var(--ok); }
  .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
  .chart-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .chart-card h3 { margin: 0 0 12px 0; font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--border); text-transform: uppercase; font-size: 11px; letter-spacing: 0.03em; }
  td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:hover td { background: rgba(255,255,255,0.02); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .badge.flagged { background: rgba(255,91,106,0.15); color: var(--danger); }
  .badge.ok { background: rgba(62,207,142,0.15); color: var(--ok); }
  .truncate { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tabs { display:flex; gap: 8px; margin-bottom: 14px; }
  .tab-btn { background: var(--card); border: 1px solid var(--border); color: var(--muted); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .tab-btn.active { color: var(--text); border-color: var(--accent); }
  .empty-state { color: var(--muted); text-align: center; padding: 40px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>🔭 LLM Production Monitor</h1>
    <div class="sub">Traces · Evals · Guardrails · Cost tracking</div>
  </div>
  <div class="refresh-badge" id="refresh-badge">Auto-refreshing every 5s</div>
</header>

<main>
  <div class="stat-grid" id="stat-grid"></div>

  <div class="chart-grid">
    <div class="chart-card">
      <h3>Latency over time (ms)</h3>
      <canvas id="latencyChart" height="140"></canvas>
    </div>
    <div class="chart-card">
      <h3>Eval score over time</h3>
      <canvas id="evalChart" height="140"></canvas>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="all">All traces</button>
    <button class="tab-btn" data-tab="flagged">Flagged only</button>
  </div>

  <div class="chart-card" style="padding:0;">
    <table id="trace-table">
      <thead>
        <tr>
          <th>Time</th><th>Model</th><th>Prompt</th><th>Eval Score</th><th>Latency</th><th>Cost</th><th>Status</th>
        </tr>
      </thead>
      <tbody id="trace-tbody"></tbody>
    </table>
    <div class="empty-state" id="empty-state" style="display:none;">
      No traces yet. Run <code>python scripts/demo_app.py</code> to generate demo traffic.
    </div>
  </div>
</main>

<script>
const API = window.location.origin;
let currentTab = 'all';
let latencyChart, evalChart;

async function fetchJSON(path) {
  const res = await fetch(API + path);
  return res.json();
}

function fmtTime(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString();
}

function renderStats(m) {
  const cards = [
    { label: 'Total Traces', value: m.total_traces },
    { label: 'Avg Latency', value: m.avg_latency_ms.toFixed(0) + ' ms' },
    { label: 'Avg Eval Score', value: m.avg_eval_score !== null ? m.avg_eval_score.toFixed(2) + ' / 5' : '—',
      cls: m.avg_eval_score !== null && m.avg_eval_score < 3 ? 'danger' : 'ok' },
    { label: 'Total Cost', value: '$' + m.total_cost_usd.toFixed(4) },
    { label: 'Flagged Rate', value: (m.flagged_rate * 100).toFixed(1) + '%',
      cls: m.flagged_rate > 0.2 ? 'danger' : 'ok' },
    { label: 'Blocked Inputs', value: m.blocked_count, cls: m.blocked_count > 0 ? 'danger' : 'ok' },
  ];
  document.getElementById('stat-grid').innerHTML = cards.map(c => `
    <div class="stat-card">
      <div class="label">${c.label}</div>
      <div class="value ${c.cls || ''}">${c.value}</div>
    </div>
  `).join('');
}

function renderCharts(traces) {
  const sorted = [...traces].reverse();
  const labels = sorted.map(t => fmtTime(t.timestamp));
  const latencies = sorted.map(t => t.latency_ms);
  const scores = sorted.map(t => t.eval_score);

  const commonOpts = {
    responsive: true,
    plugins: { legend: { display: false } },
    scales: {
      x: { ticks: { color: '#8b93a7', maxTicksLimit: 8 }, grid: { color: '#232838' } },
      y: { ticks: { color: '#8b93a7' }, grid: { color: '#232838' } }
    }
  };

  if (latencyChart) latencyChart.destroy();
  latencyChart = new Chart(document.getElementById('latencyChart'), {
    type: 'line',
    data: { labels, datasets: [{ data: latencies, borderColor: '#5b8cff', backgroundColor: 'rgba(91,140,255,0.1)', fill: true, tension: 0.3, pointRadius: 2 }] },
    options: commonOpts
  });

  if (evalChart) evalChart.destroy();
  evalChart = new Chart(document.getElementById('evalChart'), {
    type: 'line',
    data: { labels, datasets: [{ data: scores, borderColor: '#3ecf8e', backgroundColor: 'rgba(62,207,142,0.1)', fill: true, tension: 0.3, pointRadius: 2, min: 0, max: 5 }] },
    options: { ...commonOpts, scales: { ...commonOpts.scales, y: { ...commonOpts.scales.y, min: 0, max: 5 } } }
  });
}

function renderTable(traces) {
  const tbody = document.getElementById('trace-tbody');
  const emptyState = document.getElementById('empty-state');

  if (traces.length === 0) {
    tbody.innerHTML = '';
    emptyState.style.display = 'block';
    return;
  }
  emptyState.style.display = 'none';

  tbody.innerHTML = traces.map(t => `
    <tr>
      <td>${fmtTime(t.timestamp)}</td>
      <td>${t.model}</td>
      <td class="truncate" title="${t.prompt.replace(/"/g, '&quot;')}">${t.prompt}</td>
      <td>${t.eval_score !== null ? t.eval_score.toFixed(1) : '—'}</td>
      <td>${t.latency_ms.toFixed(0)} ms</td>
      <td>$${t.cost_usd.toFixed(5)}</td>
      <td>${t.flagged ? `<span class="badge flagged" title="${t.flag_reason || ''}">Flagged</span>` : '<span class="badge ok">OK</span>'}</td>
    </tr>
  `).join('');
}

async function refresh() {
  const metrics = await fetchJSON('/metrics/summary');
  renderStats(metrics);

  const path = currentTab === 'flagged' ? '/traces/flagged?limit=50' : '/traces?limit=50';
  const traces = await fetchJSON(path);
  renderTable(traces);

  const allTraces = await fetchJSON('/traces?limit=50');
  renderCharts(allTraces);
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    refresh();
  });
});

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
